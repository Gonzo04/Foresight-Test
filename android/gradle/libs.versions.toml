[versions]
agp = "8.6.1"
kotlin = "2.0.21"
ktor = "2.0.3"
arrow = "1.1.5"
kodein = "7.22.0"
kermit = "2.0.4"
napier = "2.7.1"
settings = "1.1.1"
jsoup = "1.17.2"
javaJwt = "3.19.4"
slf4j = "2.0.13"
logback = "1.5.6"
exposed = "0.53.0"
sqlite = "3.46.0.0"
oneSignal = "4.8.6"
segment = "4.11.3"
mixpanel = "8.2.0"
amplitude = "1.18.0"
streamWebrtc = "1.3.8"

[libraries]
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json" }
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
arrow-fx-coroutines = { module = "io.arrow-kt:arrow-fx-coroutines", version.ref = "arrow" }
kodein-di = { module = "org.kodein.di:kodein-di", version.ref = "kodein" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
napier = { module = "io.github.aakira:napier", version.ref = "napier" }
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "settings" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "javaJwt" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
one-signal = { module = "com.onesignal:OneSignal", version.ref = "oneSignal" }
segment-analytics = { module = "com.segment.analytics.android:analytics", version.ref = "segment" }
mixpanel = { module = "com.mixpanel.android:mixpanel-android", version.ref = "mixpanel" }
amplitude = { module = "com.amplitude:analytics-android", version.ref = "amplitude" }
stream-webrtc = { module = "io.getstream:stream-webrtc-android", version.ref = "streamWebrtc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
